name: E-commerce CI
on:
  push:
    branches: [main, production-hardening-storefront]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js && node --check auth.js && node --check db.js
      - name: Automated backend tests
        env:
          JWT_SECRET: ci-test-secret-please-use-a-longer-secret-123456789
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: CI-admin-password-123456
          DB_PATH: ./ci-store.db
          NODE_ENV: test
          CORS_ORIGIN: http://127.0.0.1:3000
        run: npm test
      - name: Start application
        env:
          JWT_SECRET: ci-test-secret-please-use-a-longer-secret-123456789
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: CI-admin-password-123456
          DB_PATH: ./ci-server.db
          NODE_ENV: test
        run: |
          node server.js > server.log 2>&1 &
          echo $! > server.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/api/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:3000/api/health
      - name: Smoke test authentication and authorization
        run: |
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' -d '{"name":"CI User","email":"ci-user@example.com","password":"CI-password-123456"}' http://127.0.0.1:3000/api/auth/signup
          curl -fsS -b cookies.txt http://127.0.0.1:3000/api/auth/me
          curl -fsS http://127.0.0.1:3000/api/products
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt http://127.0.0.1:3000/api/admin/stats)" = "403"
